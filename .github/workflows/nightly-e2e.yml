name: FE Nightly E2E

on:
  schedule:
    - cron: '0 17 * * *' # 00:00 ICT
  workflow_dispatch:

jobs:
  mutating-cross-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Mutating E2E
        run: npm run test:e2e:mutating
        continue-on-error: true
      - name: Cross-browser
        run: npm run test:e2e:cross-browser
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
